<!--
  这个页面是**手写静态页**，由 GitHub Pages 直接发出，没有任何服务端。
  因此这里刻意**没有** canonical / og:url / GTM / AdSense / 站长验证这些需要
  按部署地址生成的标记 —— 它们原本由 aibox 的服务端按环境变量注入（见 docs/deploy.md）。

  路径全部是**相对路径**（`site.css` 而不是 `/site.css`）：站点既可能挂在
  `https://<用户名>.github.io/<仓库>/` 下，也可能挂在自定义域名的根下，
  相对路径两种都能用，不需要任何 BASE_PATH 配置，也就不存在"换个域名整站白屏"。
  下面这行 base 标签把这些相对路径钉在**本文件所在目录**上，与访问地址怎么写无关
  （少了它，`/trend.html` 与 `/trend.html/` 这类地址会解析到不同的目录）。
-->
<base href="./">
<link rel="stylesheet" href="site.css">
</head>
